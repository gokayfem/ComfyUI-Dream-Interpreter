name: Publish to Comfy Registry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - ".github/workflows/publish.yml"

concurrency:
  group: comfy-registry-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Check Registry credential
        id: credential
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        shell: bash
        run: |
          if [[ -n "$REGISTRY_ACCESS_TOKEN" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Registry publish skipped::Add the REGISTRY_ACCESS_TOKEN repository secret to enable publishing."
          fi
      - name: Publish Custom Node
        if: steps.credential.outputs.available == 'true'
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
      - name: Record skipped publication
        if: steps.credential.outputs.available != 'true'
        run: echo "Registry publication was skipped because REGISTRY_ACCESS_TOKEN is not configured." >> "$GITHUB_STEP_SUMMARY"
